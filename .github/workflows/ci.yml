name: CI

on:
  push:
    branches: [unstable]
  pull_request:
    branches: [unstable]

env:
  RUSTC_BOOTSTRAP: "1"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Check (default features)
        run: cargo check

      - name: Check (prolog-bridge)
        run: cargo check --features prolog-bridge

      - name: Test (prolog-bridge)
        run: cargo test --features prolog-bridge

      - name: Run examples
        run: ./run_examples.sh
